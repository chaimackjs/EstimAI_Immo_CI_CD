name: Qualite du code

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer la configuration CI/CD
        uses: actions/checkout@v4

      - name: Recuperer l'application
        uses: actions/checkout@v4
        with:
          repository: chaimackjs/EstimAI_Immo
          ref: main
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Installer les dependances de developpement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements-dev.txt

      - name: Verifier la syntaxe Python
        working-directory: app
        run: python -m compileall -q .

      - name: Auditer la securite des dependances
        working-directory: app
        run: python -m pip_audit -r requirements.txt

      - name: Executer les tests et mesurer la couverture
        working-directory: app
        run: >-
          python -m pytest -q
          --cov=.
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --cov-fail-under=70

      - name: Publier les rapports de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-couverture-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/coverage.xml
            app/htmlcov/

      - name: Verifier la documentation Markdown
        if: always()
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "app/**/*.md"

      - name: Creer une issue en cas d'echec
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] Echec de ${context.workflow}`;
            const body = [
              `Le workflow **${context.workflow}** a echoue.`,
              `Commit : \`${context.sha}\``,
              `Execution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100
            });
            const issue = issues.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, body
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
