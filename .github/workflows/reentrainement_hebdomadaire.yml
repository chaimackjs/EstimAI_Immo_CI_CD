name: Réentraînement hebdomadaire

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier-et-reentrainer:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer la configuration CI/CD
        uses: actions/checkout@v4

      - name: Récupérer l’application
        uses: actions/checkout@v4
        with:
          repository: chaimackjs/EstimAI_Immo
          ref: main
          path: app

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Vérifier les nouvelles données
        id: verifier_donnees
        run: |
          set +e
          python verifier_nouvelles_donnees.py --strict
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "nouvelles_donnees=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "nouvelles_donnees=false" >> "$GITHUB_OUTPUT"

      - name: Récupérer les données
        if: steps.verifier_donnees.outputs.nouvelles_donnees == 'true'
        working-directory: app
        run: >-
          python acquisition_donnees.py
          --avec-dpe
          --force

      - name: Préparer les données
        if: steps.verifier_donnees.outputs.nouvelles_donnees == 'true'
        working-directory: app
        run: python preparer_donnees.py --force

      - name: Réentraîner les modèles
        if: steps.verifier_donnees.outputs.nouvelles_donnees == 'true'
        working-directory: app
        run: python ml.py

      - name: Enregistrer l’état des sources
        if: steps.verifier_donnees.outputs.nouvelles_donnees == 'true'
        run: python verifier_nouvelles_donnees.py --mettre-a-jour

      - name: Publier le nouvel état
        if: steps.verifier_donnees.outputs.nouvelles_donnees == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_sources_state.json
          git diff --cached --quiet || git commit -m "chore: mettre à jour l état des sources"
          git push