name: EstimAI_Immo CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI/CD
        uses: actions/checkout@v4

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: chaimackjs/EstimAI_Immo
          ref: main
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Vérifier les nouvelles données
        id: verifier_donnees
        continue-on-error: true
        run: python verifier_nouvelles_donnees.py --strict

      - name: Signaler les nouvelles données
        if: steps.verifier_donnees.outcome == 'failure'
        run: echo "::warning::De nouvelles données DVF ou DPE sont disponibles."

      - name: Récupérer les données
        working-directory: app
        run: >-
          python acquisition_donnees.py
          --avec-dpe
          --departements 69
          --annee-debut 2021
          --annee-fin "$(date -d '1 year ago' +%Y)"
          --force

      - name: Préparer les données
        working-directory: app
        run: python preparer_donnees.py --force

      - name: Entraîner les modèles
        working-directory: app
        run: python ml.py --r2-total-minimum 0.70 --exiger-qualite

      - name: Publier le modele valide et les metriques
        uses: actions/upload-artifact@v4
        with:
          name: modele-estimai-${{ github.sha }}
          retention-days: 14
          path: |
            app/models/meilleur_modele.joblib
            app/reports/metriques.json
            app/reports/comparaison_validation.csv

      - name: Mettre a jour le modele du depot applicatif
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/meilleur_modele.joblib
          git diff --cached --quiet || git commit -m "chore: publier le modele valide"
          git push origin HEAD:main
